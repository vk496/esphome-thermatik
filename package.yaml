    id: feature_config
    icon: "mdi:cog-outline"
    name: "Feature configuration"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0

  - platform: ble_client
    type: characteristic
    ble_client_id: my_ble_device
    id: read_ble_characteristic
    icon: "mdi:bluetooth-transfer"
    internal: true
    name: "RX stream"
    service_uuid: ${MAIN_SERVICE}
    characteristic_uuid: ${DATA_BUFFER}
    update_interval: never
    lambda: |-
      std::string hex;
      for (auto b : x) {
        char buf[10];
        sprintf(buf, "%02X ", b);
        hex += buf;
      }
      ESP_LOGV("thermatik", "RX #%u %u bytes: %s", static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]),
               static_cast<unsigned>(x.size()), hex.c_str());



      // ESPHome also reads on connection. Only consume our own pending reads.
      if (!id(connected) || !id(read_pending)) {
        id(thermatik_diagnostics)[thermatik::DIAG_UNSOLICITED]++;
        ESP_LOGD("thermatik", "Ignoring unsolicited RX: connected=%d pending=%d bytes=%u",
                 id(connected), id(read_pending), static_cast<unsigned>(x.size()));
        return NAN;
      }
      id(read_pending) = false;
      const size_t batch_size = id(current_batch).size();
      if (batch_size == 0 || batch_size > 5 || x.size() < batch_size * 2) {
        id(thermatik_diagnostics)[thermatik::DIAG_MALFORMED]++;
        ESP_LOGW("thermatik", "Invalid BLE response length: %u bytes for %u keys",
                 static_cast<unsigned>(x.size()), static_cast<unsigned>(batch_size));
        id(is_polling) = false;
        id(confirming_write) = false;
        id(current_batch).clear();
        return NAN;
      }


      id(thermatik_diagnostics)[thermatik::DIAG_REPLIES]++;
      ESP_LOGD("thermatik", "RX #%u matched %u slots in %u ms",
               static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), static_cast<unsigned>(batch_size),
               static_cast<unsigned>(millis() - id(thermatik_diagnostics)[thermatik::DIAG_STARTED_MS]));
      const bool is_confirmation = id(confirming_write);
      if (is_confirmation) {
        const uint16_t actual = (x[1] << 8) | x[0];
        id(write_readback_matches) = batch_size == 1 && actual == id(expected_write_value);
        if (id(write_readback_matches)) ESP_LOGI("thermatik", "TX #%u readback confirmed: %s=%u elapsed=%u ms",
            static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), id(current_batch)[0].c_str(),
            static_cast<unsigned>(actual), static_cast<unsigned>(millis() - id(thermatik_diagnostics)[thermatik::DIAG_STARTED_MS]));
        else ESP_LOGW("thermatik", "Readback differs: %s expected=%u actual=%u; publishing actual controller state",
            id(current_batch)[0].c_str(), static_cast<unsigned>(id(expected_write_value)), static_cast<unsigned>(actual));
      }
      // Availability can follow a temperature in the same response. Decode it first.
      for (size_t i = 0; i < batch_size; ++i) {
        if (id(current_batch)[i] == "cSensorStatus") {
          id(sensor_status_value) = (x[2*i+1] << 8) | x[2*i];
          if (!thermatik::sensor_available(id(sensor_status_value), 4)) id(cAmbientTemp).publish_state(NAN);
          if (!thermatik::sensor_available(id(sensor_status_value), 0)) id(pt_temperature_1).publish_state(NAN);
          if (!thermatik::sensor_available(id(sensor_status_value), 1)) id(pt_temperature_2).publish_state(NAN);
          if (!thermatik::sensor_available(id(sensor_status_value), 2)) id(pt_temperature_3).publish_state(NAN);
        }
      }
      uint16_t controller_low = 0, controller_high = 0, bluetooth_low = 0, bluetooth_high = 0;
      bool have_controller_low = false, have_controller_high = false;
      bool have_bluetooth_low = false, have_bluetooth_high = false;
      for (size_t i = 0; i < id(current_batch).size(); i++) {

        std::string target_batch = id(current_batch)[i];

        int value_left = x[i*2];
        int value_right = x[i*2+1];
        int value_le = (x[i*2+1] << 8) | x[i*2];
        int value_be = (x[i*2] << 8) | x[i*2+1];

        const auto register_bytes = get_read_bytes(target_batch, id(firmware_modern), id(firing_mode_bytes), "${FiringModeAttr}");
        const unsigned register_address = register_bytes.size() == 2 ? (register_bytes[1] << 8) | register_bytes[0] : 0;
        ESP_LOGD("thermatik", "  [%u] %s @0x%04X raw=0x%04X u16=%u s16=%d",
                 static_cast<unsigned>(i), target_batch.c_str(), register_address, static_cast<unsigned>(value_le),
                 static_cast<unsigned>(value_le), static_cast<int>(thermatik::signed_word(value_le)));

        // Developer output remains raw and includes both endian interpretations.
        if (id(DevSensorKeyText).state == target_batch) {
          char buf[128];
          snprintf(buf, sizeof(buf),
                  "(%s): %02X %02X | le: %d | s16: %d | be: %d",
                  target_batch.c_str(), value_left, value_right, value_le, static_cast<int>(thermatik::signed_word(value_le)), value_be);

          id(DevSensorValueText).publish_state(buf);
        }


        if ("cAmbientTemp" == target_batch ) {
          const bool available = thermatik::sensor_available(id(sensor_status_value), 4);
          id(cAmbientTemp).publish_state(available ? thermatik::signed_word(value_le) : NAN);
          ESP_LOGD("thermatik", "  Ambient=%s sensor_status=0x%04X", available ? "available" : "unavailable", id(sensor_status_value));

        } else if ("vTcTemp1" == target_batch) {
          id(vTcTemp1).publish_state(thermatik::signed_word(value_le));

        } else if ("${FiringModeAttr}" == target_batch) { // Usually FiringMode_0x1CBE
          if (value_le >= 1 && value_le <= 3) {
            id(cPowerIcon).publish_state(static_cast<size_t>(value_le - 1));
          } else {
            ESP_LOGW("thermatik", "Invalid firing mode: %d", value_le);
          }

        } else if ("cControllerStatus" == target_batch) {
          id(cControllerStatus).publish_state(value_le);

          ESP_LOGD("thermatik", "  controller state=%s", thermatik::controller_status_text(value_le));
          id(cControllerStatusText).publish_state(thermatik::controller_status_text(value_le));

        } else if ("cAirSlider" == target_batch) {
          id(cAirSlider).publish_state(value_le);
          id(cAirSliderPercentage).publish_state(value_le);

        } else if ("BoardTemp" == target_batch) {
          id(BoardTemp).publish_state(thermatik::signed_word(value_le));

        } else if ("_bDoorOpen" == target_batch) {
          id(_bDoorOpen).publish_state(value_le == 1); // bool. 0 closed, 1 open

        } else if ("cRefillStatus" == target_batch) {
          id(cRefillStatus).publish_state(value_le == 1); // bool. 0 closed, 1 open

        } else if ("cSensorError" == target_batch) {
          id(cSensorError).publish_state(value_le);
          ESP_LOGD("thermatik", "  sensor faults=%s (home mask=0x7838)", thermatik::sensor_error_text(value_le).c_str());
          id(sensor_error_description).publish_state(thermatik::sensor_error_text(value_le));

        } else if ("cAirSliderAutoManual" == target_batch) {
          if (value_le == 0 || value_le == 1) {
            id(cAirSliderAutoManual).publish_state(value_le == 1);
            id(manual_mode_known) = is_confirmation || !id(user_transaction).is_running();
          }

        } else if ("cMotorError" == target_batch) {
          id(cMotorError).publish_state(value_le);
          ESP_LOGD("thermatik", "  motor status=%s (home mask=0x00C7)", thermatik::motor_status_text(value_le).c_str());
          id(cMotorErrorText).publish_state(thermatik::motor_status_text(value_le));

        } else if ("cControllerVersion" == target_batch) {
          controller_low = value_le;
          have_controller_low = true;
        } else if ("cControllerVersion2" == target_batch) {
          controller_high = value_le;
          have_controller_high = true;
        } else if ("cBluetoothVersion" == target_batch) {
          bluetooth_low = value_le;
          have_bluetooth_low = true;
        } else if ("cBluetoothVersion2" == target_batch) {
          bluetooth_high = value_le;
          have_bluetooth_high = true;
        } else if ("cBurningModeCount" == target_batch) {
          // Bit 15 is the product-prefix flag; it is not the selected burning mode.
          ESP_LOGD("thermatik", "Burning mode count/product flags: 0x%04X", value_le);
        } else if ("Mode_0x1CD4" == target_batch) {
          id(mode_value) = value_le;
          static const char *const modes[] = {"TUV part load", "TUV full load", "Blue Angel", "Normal"};
          id(burning_mode_text).publish_state(value_le < 4 ? modes[value_le] : "Unknown");
        } else if ("cSensorStatus" == target_batch) {
          id(sensor_status_value) = value_le;
          id(cSensorStatus).publish_state(value_le);
        } else if ("cAirSliderInitialized" == target_batch) {
          id(air_slider_initialized).publish_state(value_le == 1);
        } else if ("vPtTempDec1" == target_batch || "vPtTempDec2" == target_batch ||
                   "vPtTempDec3" == target_batch) {
          const int channel = target_batch.back() - '1';
          const bool available = thermatik::sensor_available(id(sensor_status_value), channel);
          const float temperature = available ? thermatik::signed_word(value_le) / 10.0f : NAN;
          ESP_LOGD("thermatik", "  PT%d=%s decoded=%.1f C sensor_status=0x%04X", channel + 1,
                   available ? "available" : "unavailable", temperature, static_cast<unsigned>(id(sensor_status_value)));
          if (channel == 0) id(pt_temperature_1).publish_state(temperature);
          if (channel == 1) id(pt_temperature_2).publish_state(temperature);
          if (channel == 2) id(pt_temperature_3).publish_state(temperature);
        } else if ("hourCounter" == target_batch) {
          id(operating_hours).publish_state(value_le);
        } else if ("_RelayStatus" == target_batch) {
          id(relay_status).publish_state(value_le);
          id(relay_1_active).publish_state((value_le & 1) != 0);
          id(relay_2_active).publish_state((value_le & 2) != 0);
          id(relay_3_active).publish_state((value_le & 4) != 0);
          ESP_LOGD("thermatik", "  Relays 1/2/3=%d/%d/%d", (value_le & 1) != 0, (value_le & 2) != 0, (value_le & 4) != 0);
        } else if (target_batch == "RelayFunct1" || target_batch == "RelayFunct2" || target_batch == "RelayFunct3") {
          const char *function = thermatik::relay_function_text(value_le);
          if (target_batch == "RelayFunct1") id(relay_1_function).publish_state(function);
          if (target_batch == "RelayFunct2") id(relay_2_function).publish_state(function);
          if (target_batch == "RelayFunct3") id(relay_3_function).publish_state(function);
          ESP_LOGD("thermatik", "  %s=%s (raw=%u)", target_batch.c_str(), function, value_le);
        } else if ("cFeatureConfig" == target_batch) {
          id(feature_config).publish_state(value_le);

        } else if (id(DevSensorKeyText).state != target_batch) {
          ESP_LOGW("thermatik", "Unhandled poll key %s (value: %d)", target_batch.c_str(), value_le);
        }

      }

      if (have_controller_low && have_controller_high) {
        const auto version = thermatik::firmware_version(controller_low, controller_high);
        if (version.valid()) {
          id(controller_version_text).publish_state(version.text());
          id(device_info_read) = true;
          id(firmware_modern) = version.modern_registers();
          if (strcmp("${FiringModeAttr}", "auto") == 0) {
            id(firing_mode_bytes) = get_hex_bytes(id(firmware_modern) ? "FiringMode_0x1CBE" : "FiringMode_0x1C5C");
          }
          const auto &address = id(firing_mode_bytes);
          ESP_LOGI("thermatik", "Controller firmware=%s raw=%04X:%04X flags=0x%02X layout=%s heating_register=0x%04X selection=${FiringModeAttr}",
                   version.text().c_str(), controller_high, controller_low, version.flags,
                   id(firmware_modern) ? ">=1.15.0" : "legacy",
                   address.size() == 2 ? static_cast<unsigned>((address[1] << 8) | address[0]) : 0);
          // Old firmware does not use the newer certification-mode register.
          if (!id(firmware_modern)) {
            id(mode_value) = 3;
            id(burning_mode_text).publish_state("Normal");
          }
        } else {
          id(controller_version_text).publish_state("Unknown");
          ESP_LOGW("thermatik", "Invalid controller firmware words: %04X %04X", controller_low, controller_high);
        }
      }
      if (have_bluetooth_low && have_bluetooth_high) {
        const auto version = thermatik::firmware_version(bluetooth_low, bluetooth_high);
        ESP_LOGI("thermatik", "Bluetooth firmware=%s raw=%04X:%04X", version.valid() ? version.text().c_str() : "Unknown",
                 bluetooth_high, bluetooth_low);
        id(bluetooth_version_text).publish_state(version.valid() ? version.text() : "Unknown");
      }
      id(confirming_write) = false;
      id(is_polling) = false;
      id(current_batch).clear();

      id(last_ble_read) = millis();
      ESP_LOGD("thermatik", "Updated last BLE read: %u", static_cast<unsigned>(id(last_ble_read)));

      return true;
