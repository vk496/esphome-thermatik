select:
  - platform: template
    id: cPowerIcon
    name: "Heating"
    icon: "mdi:fire"
    options:
      - "Low"
      - "Mid"
      - "High"
    optimistic: false
    set_action:
      - lambda: |-
          ESP_LOGD("thermatik", "Triggered set powerIcon action");
          if (!id(connected) || id(firing_mode_bytes).empty() ||
              !id(manual_mode_known) || id(user_transaction).is_running() ||
              id(cAirSliderAutoManual).state || id(mode_value) != 3) {
            ESP_LOGW("thermatik", "Heating requires automatic control and normal burning mode");
            return;
          }
          auto index = id(cPowerIcon).index_of(x);
          if (index.has_value()) {
            int raw_value = index.value();

            // Increase by 1, since server accepts only 1, 2 and 3 as input
            raw_value = raw_value + 1;

            id(write_user_input)->execute(id(firing_mode_bytes),{(uint8_t)raw_value, 0x00});
          } else {
            ESP_LOGE("thermatik", "Invalid heating option");
          }

  - platform: template
    id: thermatik_log_level
    name: "Thermatik log level"
    entity_category: diagnostic
    icon: "mdi:text-box-search"
    optimistic: true
    initial_option: "INFO"
    restore_value: false
    options:
      - "INFO"
      - "DEBUG"
      - "VERBOSE"
    set_action:
      - lambda: |-
          const uint8_t level = x == "VERBOSE" ? ESPHOME_LOG_LEVEL_VERBOSE :
                                x == "DEBUG" ? ESPHOME_LOG_LEVEL_DEBUG : ESPHOME_LOG_LEVEL_INFO;
          esphome::logger::global_logger->set_log_level("thermatik", level);
          ESP_LOGI("thermatik", "Runtime log level=%s (INFO summaries, DEBUG decoded registers, VERBOSE raw BLE frames)", x.c_str());

switch:
  - platform: template
    id: cAirSliderAutoManual
    icon: "mdi:hand-back-right"
    optimistic: false
    name: "Air Slider Manual mode"
    turn_on_action:
      - lambda: |-
          if (id(connected)) {
            id(manual_mode_known) = false;
            ESP_LOGD("thermatik", "Turned manual slider ON");
            id(write_user_input)->execute(get_hex_bytes("cAirSliderAutoManual"),{0x01, 0x00});
          }
    turn_off_action:
      - lambda: |-
          if (id(connected)) {
            id(manual_mode_known) = false;
            ESP_LOGD("thermatik", "Turned manual slider OFF");
            id(write_user_input)->execute(get_hex_bytes("cAirSliderAutoManual"),{0x00, 0x00});
          }

number:
  - platform: template
    id: cAirSliderPercentage
    name: "Air Slider value"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:fan-alert"
    set_action:
      then:
        - lambda: |-
            ESP_LOGD("thermatik", "Triggered airslider action");
            if (id(connected) && id(manual_mode_known) && !id(user_transaction).is_running() &&
                id(cAirSliderAutoManual).state) {
              id(write_user_input)->execute(get_hex_bytes("cAirSlider"),{(uint8_t)x, 0x00});

            } else {
              ESP_LOGW("thermatik", "Manual mode not enabled");

              // Restore to previous
              id(cAirSliderPercentage).publish_state(id(cAirSlider).state);
            }

