substitutions:
  # Expected user input
  mac_address: "" # fail by default
  pincode: 000000
  fetch_interval: 7s
  ble_write_settle: 1200ms # APK BLE.writeDelay after ADDRESS and DATA
  ble_read_settle: 2s # Conservatively retain measured controller response delay
  ble_response_timeout: 3s # APK operation timeout; timeout forces a clean reconnect

  FiringModeAttr: "auto" # Or force FiringMode_0x1C5C / FiringMode_0x1CBE

  # Internal
  MAIN_SERVICE: "0000fff0-0000-1000-8000-00805f9b34fb"
  ADDRESS_BUFFER: "0000fff1-0000-1000-8000-00805f9b34fb"
  DATA_BUFFER: "0000fff2-0000-1000-8000-00805f9b34fb"

esphome:
  # Package-relative header paths are supported since ESPHome 2026.9.0.
  min_version: 2026.9.0
  includes:
    - src/thermatik_protocol.h
    - src/ble_values.h
    - src/thermatik_writer.h
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            thermatik::gatt_writer().configure(id(my_ble_device),
                "${MAIN_SERVICE}", "${ADDRESS_BUFFER}", "${DATA_BUFFER}");
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("thermatik", "Integration ready: controller writes enabled on user request, firing register=%s, poll=${fetch_interval}",
                     "${FiringModeAttr}");

# Compile detailed diagnostics once; change the Thermatik log level at runtime.
logger:
  level: VERBOSE
  initial_level: INFO
  runtime_tag_levels: true
  logs:
    esp32_ble_tracker: INFO
    thermatik: INFO

esp32_ble:
  io_capability: keyboard_display

ble_client:
  - mac_address: ${mac_address}
    id: my_ble_device
    auto_connect: true
    on_connect:
      then:
        - lambda: |-
            ESP_LOGI("thermatik", "BLE connected; requesting pairing and starting firmware discovery");
            id(my_ble_device)->pair();
            id(connected)=true;
    on_passkey_request:
      then:
        - lambda: |-
            ESP_LOGD("thermatik", "PAIRING BLE passkey request");
        - ble_client.passkey_reply:
            id: my_ble_device
            passkey: ${pincode}
    on_disconnect:
      then:
        - lambda: |-
            id(thermatik_diagnostics)[thermatik::DIAG_DISCONNECTS]++;
            ESP_LOGW("thermatik", "BLE disconnected: tx=%u pending=%d polling=%d user_busy=%d; clearing session",
                     static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), id(read_pending), id(is_polling), id(is_writing_user));
            id(connected)=false;
        - script.stop: process_batches
        - script.stop: read_batch_values
        - script.stop: write_dev_addr
        - script.stop: write_user_input
        - script.stop: user_transaction
        - script.stop: write_ble_to_address
        - script.stop: write_ble_to_data
        - lambda: |-
            id(device_info_read) = false;
            id(manual_mode_known) = false;
            id(mode_value) = 65535;
            id(firmware_modern) = false;
            id(sensor_status_value) = 65535;
            id(last_diagnostics) = 0;
            if (strcmp("${FiringModeAttr}", "auto") == 0) id(firing_mode_bytes).clear();
            id(read_pending) = false;
            id(confirming_write) = false;
            id(is_polling) = false;
            id(is_writing_user) = false;
            id(current_batch).clear();
            id(current_chunk).clear();
            id(current_address_buffer).clear();
            id(current_data_buffer).clear();

# Between writes and reads, we need to store which batch we actually waiting

globals:
  - id: thermatik_diagnostics
    type: std::array<uint32_t, 7>

  - id: firing_mode_bytes
    type: std::vector<uint8_t>
    initial_value: |-
      []() {
        // Only these registers are supported heating controls.
        constexpr bool firing_mode_valid =
            strcmp("${FiringModeAttr}", "auto") == 0 ||
            strcmp("${FiringModeAttr}", "FiringMode_0x1C5C") == 0 ||
            strcmp("${FiringModeAttr}", "FiringMode_0x1CBE") == 0;
        static_assert(firing_mode_valid,
                      "FiringModeAttr must be auto, FiringMode_0x1C5C or FiringMode_0x1CBE");
        if (strcmp("${FiringModeAttr}", "auto") == 0) return std::vector<uint8_t>{};
        return get_hex_bytes("${FiringModeAttr}");
      }()

  - id: confirming_write
    type: bool
    initial_value: "false"
  - id: write_readback_matches
    type: bool
    initial_value: "false"
  - id: expected_write_value
    type: uint16_t
    initial_value: "0"

  - id: device_info_read
    type: bool
    initial_value: "false"
  - id: firmware_modern
    type: bool
    initial_value: "false"
  - id: mode_value
    type: uint16_t
    initial_value: "65535"
  - id: manual_mode_known
    type: bool
    initial_value: "false"
  - id: sensor_status_value
    type: uint16_t
    initial_value: "65535"
  - id: poll_cycle
    type: std::vector<std::string>
  - id: last_diagnostics
    type: uint32_t
    initial_value: "0"

  - id: last_ble_read
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: connected
    type: bool
    initial_value: "false"

  - id: current_address_buffer
    type: std::vector<uint8_t>

  - id: current_data_buffer
    type: std::vector<uint8_t>

  - id: current_index
    type: int
    initial_value: "0"

  - id: current_chunk
    type: std::vector<std::string>

  - id: current_batch
    type: std::vector<std::string>

  # Write to ADDR buffer, wait, read from VAL buffer
  - id: is_polling
    type: bool
    initial_value: "false"

  # A response is expected only after an explicit characteristic read.
  - id: read_pending
    type: bool
    initial_value: "false"

  - id: is_writing_user
    type: bool
    initial_value: "false"

  - id: fallback_fill_5_elements
    type: std::vector<std::string>
    initial_value: |-
      {
        "vTcTemp1", 
        "cAmbientTemp",
        "_bDoorOpen",
        "cAirSlider",
        "BoardTemp"
      }

  - id: pool_batches
    type: std::vector<std::string>
    initial_value: |-
      {
        "cSensorStatus",
        "cAmbientTemp",
        "vTcTemp1", 
        "${FiringModeAttr}", 
        "cControllerStatus", 
        "cAirSlider",
        "cMotorError",
        "BoardTemp",
        "cAirSliderAutoManual",
        "_bDoorOpen",
        "cRefillStatus",
        "cSensorError",
        "_RelayStatus",
        "cAirSliderInitialized",
        "Mode_0x1CD4",
      }

# Main trigger
interval:
  - interval: 60s
    startup_delay: 45s
    then:
      - script.execute: log_thermatik_diagnostics

  - interval: 3min
    startup_delay: 5min
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t last = id(last_ble_read);

          // Handle millis() rollover automatically using subtraction
          uint32_t diff = now - last;

          if (last == 0 || diff > 300000U) {  // 5 minutes
            ESP_LOGE("thermatik", "BLE freeze detected, rebooting...");
            id(restart_button).press();
          } else {
            ESP_LOGD("thermatik", "BLE watchdog OK (diff=%u ms)", static_cast<unsigned>(diff));
          }

  - interval: ${fetch_interval}
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: "return id(connected) && !id(process_batches).is_running();"
          then:
            - script.execute: process_batches

button:
  - platform: template
    name: "Reboot BLE"
    icon: "mdi:bluetooth-settings"
    device_class: restart # makes it behave like the restart button
    on_press:
      - lambda: id(my_ble_device).set_auto_connect(false); // disable auto connect
      - ble_client.disconnect: my_ble_device
      - delay: 10s
      - button.press: restart_button

  - platform: restart
    internal: True
    id: restart_button
    name: "Restart ESP"
    icon: "mdi:restart"

  - platform: template
    name: "Door Remote"
    icon: "mdi:fireplace-off"
    disabled_by_default: true
    on_press:
      - lambda: |-
          ESP_LOGD("thermatik", "Triggered Door");
          id(write_user_input)->execute(get_hex_bytes("cSezam"),{0x01, 0x00});

  - platform: template
    name: "Thermatik diagnostics"
    icon: "mdi:clipboard-text-search"
    entity_category: diagnostic
    on_press:
      - script.execute: log_thermatik_diagnostics

  - platform: template
    name: "Save user settings"
    icon: "mdi:content-save"
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(write_user_input).execute(get_hex_bytes("cSaveUserData"), {0x01, 0x00});

script:
  - id: log_thermatik_diagnostics
    then:
      - lambda: |-
          const auto &stats = id(thermatik_diagnostics);
          const auto &address = id(firing_mode_bytes);
          ESP_LOGI("thermatik", "Diagnostics: connected=%d firmware_ready=%d pending=%d polling=%d user_busy=%d",
                   id(connected), id(device_info_read), id(read_pending), id(is_polling), id(is_writing_user));
          ESP_LOGI("thermatik", "Counters: tx=%u replies=%u malformed=%u unsolicited=%u timeouts=%u disconnects=%u last_reply_age=%u ms",
                   static_cast<unsigned>(stats[thermatik::DIAG_SEQUENCE]), static_cast<unsigned>(stats[thermatik::DIAG_REPLIES]), static_cast<unsigned>(stats[thermatik::DIAG_MALFORMED]),
                   static_cast<unsigned>(stats[thermatik::DIAG_UNSOLICITED]), static_cast<unsigned>(stats[thermatik::DIAG_TIMEOUTS]), static_cast<unsigned>(stats[thermatik::DIAG_DISCONNECTS]),
                   static_cast<unsigned>(millis() - id(last_ble_read)));
          ESP_LOGI("thermatik", "State: controller=%s bluetooth=%s heating_register=0x%04X mode=%u manual_known=%d manual=%d sensor_flags=0x%04X",
                   id(controller_version_text).state.c_str(), id(bluetooth_version_text).state.c_str(),
                   address.size() == 2 ? static_cast<unsigned>((address[1] << 8) | address[0]) : 0,
                   static_cast<unsigned>(id(mode_value)), id(manual_mode_known), id(cAirSliderAutoManual).state,
                   static_cast<unsigned>(id(sensor_status_value)));

  - id: write_ble_to_address
    then:
      - lambda: |-
          thermatik::gatt_writer().write_address(id(current_address_buffer));
      - wait_until:
          condition:
            lambda: "return thermatik::gatt_writer().done();"
          timeout: ${ble_response_timeout}
      - if:
          condition:
            lambda: "return !thermatik::gatt_writer().success();"
          then:
            - script.execute: abort_ble_transaction

  - id: write_ble_to_data
    then:
      - lambda: |-
          thermatik::gatt_writer().write_data(id(current_data_buffer));
      - wait_until:
          condition:
            lambda: "return thermatik::gatt_writer().done();"
          timeout: ${ble_response_timeout}
      - if:
          condition:
            lambda: "return !thermatik::gatt_writer().success();"
          then:
            - script.execute: abort_ble_transaction

  - id: abort_ble_transaction
    then:
      - lambda: |-
          if (!thermatik::gatt_writer().done()) id(thermatik_diagnostics)[thermatik::DIAG_TIMEOUTS]++;
          thermatik::gatt_writer().timeout();
          ESP_LOGW("thermatik", "TX #%u aborted after BLE operation failure; disconnecting",
                   static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]));
          id(connected) = false;
          id(read_pending) = false;
          id(confirming_write) = false;
          id(is_polling) = false;
          id(is_writing_user) = false;
          id(current_batch).clear();
      - script.stop: user_transaction
      - script.stop: read_batch_values
      - script.stop: process_batches
      - ble_client.disconnect: my_ble_device

  - id: process_batches
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(device_info_read);"
          then:
            - lambda: |-
                id(current_chunk) = {"cControllerVersion", "cControllerVersion2",
                                     "cBluetoothVersion", "cBluetoothVersion2", "cBurningModeCount"};
            - script.execute: read_batch_values
            - script.wait: read_batch_values
      - if:
          condition:
            lambda: "return !id(connected) || !id(device_info_read);"
          then:
            - script.stop: process_batches
      - lambda: |-
          id(current_index) = 0;
          id(poll_cycle) = id(pool_batches);
          const uint32_t now = millis();
          if (id(last_diagnostics) == 0 || uint32_t(now - id(last_diagnostics)) >= 60000U) {
            const std::vector<std::string> diagnostics = {
                "vPtTempDec1", "vPtTempDec2", "vPtTempDec3", "hourCounter", "cFeatureConfig",
                "RelayFunct1", "RelayFunct2", "RelayFunct3"};
            id(poll_cycle).insert(id(poll_cycle).end(), diagnostics.begin(), diagnostics.end());
            id(last_diagnostics) = now;
          }

      - while:
          condition:
            lambda: "return id(current_index) < id(poll_cycle).size();"
          then:
            - wait_until:
                condition:
                  lambda: "return ! id(is_writing_user);"

            - lambda: |-
                const int chunk_size = 5;
                int i = id(current_index);

                // Compute the end index safely
                int end = std::min(i + chunk_size, (int) id(poll_cycle).size());

                // Create a chunk vector
                std::vector<std::string> chunk(id(poll_cycle).begin() + i, id(poll_cycle).begin() + end);

                id(current_chunk) = chunk;

            - script.execute: read_batch_values
            - script.wait: read_batch_values

            - lambda: |-
                id(current_index) += 5; //chunk_size

  - id: write_dev_addr
    parameters:
      x: string
    then:
      - lambda: |-
          ESP_LOGD("thermatik", "Developer read requested: %s", x.c_str());
          auto address = get_hex_bytes(x);
          if (address == std::vector<uint8_t>{0x00, 0x00}) {
            ESP_LOGW("thermatik", "Bad developer sensor key: %s", x.c_str());
            return;
          }
          id(user_transaction).execute(address, {}, x);

  - id: write_user_input
    parameters:
      address: std::vector<uint8_t>
      data: std::vector<uint8_t>
    then:
      - lambda: |-
          if (!id(connected) || address.size() != 2 || data.size() != 2 ||
              address == std::vector<uint8_t>{0x00, 0x00}) {
            ESP_LOGW("thermatik", "Invalid write command");
            return;
          }
          id(user_transaction).execute(address, data, "");

  # Developer reads and controls share the same queue and address/data ownership.
  - id: user_transaction
    mode: queued
    max_runs: 5
    parameters:
      address: std::vector<uint8_t>
      data: std::vector<uint8_t>
      read_key: string
    then:
      - globals.set:
          id: is_writing_user
          value: "true"
      - wait_until:
          condition:
            lambda: "return !id(connected) || !id(is_polling);"
      - if:
          condition:
            lambda: "return !id(connected) || id(is_polling);"
          then:
            - lambda: |-
                ESP_LOGW("thermatik", "Timed out waiting for user transaction");
                id(is_writing_user) = false;
            - script.stop: user_transaction
      - lambda: |-
          thermatik::begin_transaction(id(thermatik_diagnostics), millis());
          ESP_LOGD("thermatik", "TX #%u %s address=0x%04X key=%s",
                   static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), data.empty() ? "developer read" : "user write",
                   static_cast<unsigned>((address[1] << 8) | address[0]), read_key.c_str());
          if (!data.empty() && address == get_hex_bytes("cAirSliderAutoManual")) id(manual_mode_known) = false;
          id(current_address_buffer) = address;
          id(current_batch).clear();
          id(read_pending) = false;
      - script.execute: write_ble_to_address
      - script.wait: write_ble_to_address
      - if:
          condition:
            lambda: "return !read_key.empty();"
          then:
            - delay: ${ble_read_settle}
            - lambda: |-
                id(current_batch) = {read_key};
                id(is_polling) = true;
                id(read_pending) = true;
            - component.update: read_ble_characteristic
            - wait_until:
                condition:
                  lambda: "return !id(read_pending);"
                timeout: ${ble_response_timeout}
            - if:
                condition:
                  lambda: "return id(read_pending);"
                then:
                  - lambda: |-
                      id(thermatik_diagnostics)[thermatik::DIAG_TIMEOUTS]++;
                      ESP_LOGW("thermatik", "TX #%u developer read timeout: key=%s elapsed=%u ms; reconnecting",
                               static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), read_key.c_str(),
                               static_cast<unsigned>(millis() - id(thermatik_diagnostics)[thermatik::DIAG_STARTED_MS]));
                      id(connected) = false;
                      id(read_pending) = false;
                      id(current_batch).clear();
                  # Flush an unidentifiable late response before the next read.
                  - ble_client.disconnect: my_ble_device
            - globals.set:
                id: is_polling
                value: "false"
          else:
            - delay: ${ble_write_settle}
            - lambda: |-
                id(current_data_buffer) = data;
            - script.execute: write_ble_to_data
            - script.wait: write_ble_to_data
            - delay: ${ble_write_settle}
            - lambda: |-
                id(current_batch).clear();
                if (address == get_hex_bytes("cAirSliderAutoManual")) id(current_batch) = {"cAirSliderAutoManual"};
                else if (address == get_hex_bytes("cAirSlider")) id(current_batch) = {"cAirSlider"};
                else if (address == id(firing_mode_bytes)) id(current_batch) = {"${FiringModeAttr}"};
                id(expected_write_value) = (data[1] << 8) | data[0];
                id(write_readback_matches) = false;
            - if:
                condition:
                  lambda: "return !id(current_batch).empty();"
                then:
                  # Request a fresh register value instead of relying on the DATA buffer left by the write.
                  - script.execute: write_ble_to_address
                  - script.wait: write_ble_to_address
                  - delay: ${ble_read_settle}
                  - lambda: |-
                      id(confirming_write) = true;
                      id(read_pending) = true;
                      id(is_polling) = true;
                      ESP_LOGD("thermatik", "TX #%u immediate readback: key=%s expected=%u",
                               static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]),
                               id(current_batch)[0].c_str(), static_cast<unsigned>(id(expected_write_value)));
                  - component.update: read_ble_characteristic
                  - wait_until:
                      condition:
                        lambda: "return !id(read_pending);"
                      timeout: ${ble_response_timeout}
                  - if:
                      condition:
                        lambda: "return id(read_pending);"
                      then:
                        - lambda: |-
                            id(thermatik_diagnostics)[thermatik::DIAG_TIMEOUTS]++;
                            ESP_LOGW("thermatik", "Write readback timed out");
                        - script.execute: abort_ble_transaction

      - lambda: |-
          id(current_batch).clear();
          id(is_writing_user) = false;
          ESP_LOGD("thermatik", "User transaction complete");

  - id: read_batch_values
    then:
      - wait_until:
          condition:
            lambda: "return !id(connected) || !id(is_writing_user);"
      - lambda: |-
          if (!id(connected) || id(is_writing_user)) {
            ESP_LOGE("thermatik", "Timed out for read batch %d %d", id(connected), id(is_writing_user));
            id(read_batch_values).stop();
            return;
          }
      - globals.set:
          id: is_polling
          value: "true"
      - lambda: |-
          // Ensure we never process more than 5 keys
          if (id(current_chunk).size() > 5) {
            ESP_LOGW("thermatik", "Resizing chunk because it was %d length", id(current_chunk).size());
            id(current_chunk).resize(5);
          }


          // Empty vector
          id(current_batch).clear();


          std::vector<uint8_t> payload;
          payload.reserve(5 * 2);  // 5 elements * 2 bytes each

          // Resolve the firmware-dependent power register after the version probe.
          for (const auto &k : id(current_chunk)) {
            auto bytes = get_read_bytes(k, id(firmware_modern), id(firing_mode_bytes), "${FiringModeAttr}");
            if (k == "Mode_0x1CD4" && !id(firmware_modern)) continue;
            if (bytes.size() != 2 || bytes == std::vector<uint8_t>{0, 0}) continue;
            payload.insert(payload.end(), bytes.begin(), bytes.end());
            id(current_batch).push_back(k);
          }
          // Pad the address buffer with safe, firmware-independent reads.
          for (size_t i = id(current_batch).size(); i < 5; i++) {
            auto bytes = get_hex_bytes(id(fallback_fill_5_elements)[i]);
            payload.insert(payload.end(), bytes.begin(), bytes.end());
            id(current_batch).push_back(id(fallback_fill_5_elements)[i]);
          }

          std::string joined;
          for (const auto &s : id(current_batch)) {
              joined += s + ", ";
          }
          thermatik::begin_transaction(id(thermatik_diagnostics), millis());
          ESP_LOGD("thermatik", "TX #%u poll [%s]", static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), joined.c_str());


          // 3. Save to buffer
          id(current_address_buffer) = payload;

      - script.execute: write_ble_to_address
      - script.wait: write_ble_to_address

      # Allow the controller to populate DATA before yielding or reading.
      - delay: ${ble_read_settle}

      - if:
          condition:
            lambda: "return id(is_writing_user);"
          then:
            - logger.log:
                tag: thermatik
                level: DEBUG
                format: "User transaction requested; yielding before read"
            - globals.set:
                id: is_polling
                value: "false"
          else:
            - globals.set:
                id: read_pending
                value: "true"
            - component.update: read_ble_characteristic

      - wait_until:
          condition:
            lambda: "return ! id(is_polling);"
          timeout: ${ble_response_timeout} # Deadlock safety

      - if:
          condition:
            lambda: "return id(read_pending);"
          then:
            - lambda: |-
                id(thermatik_diagnostics)[thermatik::DIAG_TIMEOUTS]++;
                ESP_LOGW("thermatik", "TX #%u poll timeout: slots=%u elapsed=%u ms; reconnecting",
                         static_cast<unsigned>(id(thermatik_diagnostics)[thermatik::DIAG_SEQUENCE]), static_cast<unsigned>(id(current_batch).size()),
                         static_cast<unsigned>(millis() - id(thermatik_diagnostics)[thermatik::DIAG_STARTED_MS]));
                id(connected) = false;
                id(read_pending) = false;
                id(current_batch).clear();
            # A late response cannot be associated with a new address batch.
            - ble_client.disconnect: my_ble_device
      - lambda: |-
          id(is_polling) = false;
          id(current_batch).clear();

text:
  - platform: template
    mode: text
    name: "Dev Sensor Key"
    id: DevSensorKeyText
    icon: "mdi:database-search"
    disabled_by_default: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(write_dev_addr)->execute(x);

text_sensor:
  - platform: template
    id: cControllerStatusText
    icon: "mdi:fireplace"
    name: "Status"

  - platform: template
    id: cMotorErrorText
    icon: "mdi:engine"
    name: "Motor Status"

  - platform: template
    name: "Dev Sensor Value"
    id: DevSensorValueText
    icon: "mdi:database-eye"
    disabled_by_default: true

  - platform: template
    id: sensor_error_description
    icon: "mdi:alert-circle-outline"
    name: "Sensor errors"
    entity_category: diagnostic
  - platform: template
    id: controller_version_text
    icon: "mdi:chip"
    name: "Controller firmware"
    entity_category: diagnostic
  - platform: template
    id: bluetooth_version_text
    icon: "mdi:bluetooth"
    name: "Bluetooth firmware"
    entity_category: diagnostic
  - platform: template
